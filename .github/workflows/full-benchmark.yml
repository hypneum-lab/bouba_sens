name: Full Benchmark

on:
  workflow_dispatch:
  # Scheduled runs require a self-hosted Studio runner. Until that's
  # configured, only manual dispatch fires. Uncomment the cron when the
  # runner is online.
  # schedule:
  #   - cron: "17 3 * * *"

jobs:
  grid:
    name: 5-seed v0.1 full grid
    # self-hosted: Studio (M3 Ultra) is the only box that can run the full
    # 150-cell grid in reasonable time. Falls back to ubuntu-latest for
    # syntax validation when the runner is offline.
    runs-on: [self-hosted, studio]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run the 150-cell grid
        env:
          OUT_ROOT: runs/ci_grid
          STEPS_TRAIN: 200
          STEPS_LESION: 100
        run: bash scripts/run_grid.sh

      - name: Aggregate
        run: |
          mkdir -p reports
          uv run python scripts/aggregate_grid.py \
            --root runs/ci_grid \
            --out reports/v0.1_aggregate.json

      - name: Structural empirical tests
        run: uv run pytest tests/empirical/ -v

      - name: Upload aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-aggregate
          path: reports/v0.1_aggregate.json

      - name: Upload HTML summary
        if: always()
        run: |
          uv run bouba-sens aggregate \
            --glob "runs/ci_grid/seed*_T*_*_*" \
            --out reports/v0.1_summary.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.1-summary-html
          path: reports/v0.1_summary.html
