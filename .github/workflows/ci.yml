name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - name: Checkout bouba_sens
        uses: actions/checkout@v4
        with:
          path: bouba_sens

      - name: Checkout nerve-wml sibling
        uses: actions/checkout@v4
        with:
          repository: hypneum-lab/nerve-wml
          path: nerve-wml
          ref: v1.7.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: bouba_sens
        run: uv sync --all-extras

      - name: Ruff lint
        working-directory: bouba_sens
        run: uv run ruff check src tests

      - name: Ruff format check
        working-directory: bouba_sens
        run: uv run ruff format --check src tests

      - name: Mypy
        working-directory: bouba_sens
        run: uv run mypy src

      - name: Pytest (unit + smoke)
        working-directory: bouba_sens
        run: uv run pytest tests/unit tests/smoke -v
