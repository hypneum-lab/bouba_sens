[project]
name = "bouba_sens"
version = "0.3.0"
description = "Cross-modal plasticity benchmark — Hypneum Lab"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Clement Saillant", email = "c.saillant@gmail.com" }]
keywords = ["cross-modal-plasticity", "multimodal-benchmark", "embodied-ai", "hypneum-lab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "orjson>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "hydra-core>=1.3",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "jinja2>=3.1",
    "librosa>=0.10",
    "torchvision>=0.20",
    "scikit-learn>=1.5",
    # nerve-wml v0.1.0 is not on PyPI; installed from sibling local clone via
    # [tool.uv.sources] below. Spec §6.3 contract verified by
    # tests/smoke/test_nerve_wml_api.py.
    "nerve-wml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1",
    "pre-commit>=3.8",
]

[project.scripts]
bouba-sens = "bouba_sens.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "empirical: nightly tests that run real benchmarks",
    "smoke: fast end-to-end sanity checks",
]

[tool.coverage.run]
source = ["src/bouba_sens"]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "matplotlib.*",
    "hydra.*",
    "jinja2.*",
    "pyarrow.*",
    "track_p.*",
    "track_w.*",
    "nerve_wml.*",
    "sklearn.*",
    "librosa.*",
    "torchvision.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.uv.sources]
nerve-wml = { path = "../nerve-wml" }
